<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WhyMe Studio</title>
  <link rel="icon" type="image/png" sizes="192x192" href="https://s.guyue.me/img/icon_whyme.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: linear-gradient(145deg, #f0f4ff, #fdfdfe);
      --text-color: #222;
      --subtle: #666;
      --shadow: rgba(0, 0, 0, 0.05);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Noto Serif SC', serif;
      background: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
      line-height: 1.5;
    }

    .logo {
      width: 128px;
      height: 128px;
      margin-bottom: 24px;
      box-shadow: 0 6px 12px var(--shadow);
      border-radius: 20%;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 12px;
      line-height: 1.2;
    }

    p {
      font-size: 1.2rem;
      color: var(--subtle);
      margin-bottom: 40px;
      line-height: 1.6;
    }

    footer {
      font-size: 0.9rem;
      color: #aaa;
      position: fixed;
      bottom: 20px;
    }

    /* From Uiverse.io by Ali-Tahmazi99 */
    /* From uiverse.io by @Ali-Tahmazi99 */
    button {
      display: inline-block;
      width: 150px;
      height: 50px;
      border-radius: 10px;
      border: 1px solid #03045e;
      position: relative;
      overflow: hidden;
      transition: all 0.5s ease-in;
      z-index: 1;
      margin-bottom: 40px;
      cursor: pointer;
    }
    
    button::before,
    button::after {
      content: '';
      position: absolute;
      top: 0;
      width: 0;
      height: 100%;
      transform: skew(15deg);
      transition: all 0.5s;
      overflow: hidden;
      z-index: -1;
    }
    
    button::before {
      left: -10px;
      background: #240046;
    }
    
    button::after {
      right: -10px;
      background: #5a189a;
    }
    
    button:hover::before,
    button:hover::after {
      width: 58%;
    }
    
    button:hover span {
      color: #e0aaff;
      transition: 0.3s;
    }
    
    button span {
       color: #03045e;
       font-size: 18px;
       transition: all 0.3s ease-in;
     }
     
     a {
       text-decoration: none;
       display: inline-block;
     }
  </style>
</head>
<body>
  <img class="logo" src="https://s.guyue.me/img/icon_whyme.png" alt="WhyMe Logo" />
  <h1></h1>
  <p>Try to answer every question.</p>
  
  <!-- From Uiverse.io by Ali-Tahmazi99 -->
  <a href="/doing/">
    <button>
      <span>Doing What ?</span>
    </button>
  </a>
  
  <footer>© 2025 微米工作室. All rights reserved.</footer>
</body>
</html>
